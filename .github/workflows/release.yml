name: OmniCart Release & APK Publishing

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build Release APK and Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17 (for Android SDK 36 Gradle build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Print Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Verify Code Quality & Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Execute Automated Test Matrix
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Create GitHub Release and Attach APK
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
